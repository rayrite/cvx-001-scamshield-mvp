<style>
/* price-embed — scoped component styles, UDL-bridged (same pattern as
   recall-map-embed on /map). Everything lives under .price-embed; the
   app's /theme page restyles this card like any other. */
.price-embed{
  --pp-surface:var(--card);
  --pp-text:var(--ink);
  --pp-muted:var(--muted);
  --pp-border:var(--line);
  --pp-accent:var(--accent);
  --pp-good:var(--good);
  --pp-warn:var(--warn);
  --pp-bad:var(--bad);
  --pp-radius:12px;
  box-sizing:border-box;display:block;width:100%;
  padding:16px;background:var(--pp-surface);color:var(--pp-text);
  border:1px solid var(--pp-border);border-radius:var(--pp-radius);
}
.price-embed *{box-sizing:border-box}
/* scenario deck (walkthrough 2026-09-21: the two scenarios lead the card as
   highlighted, explained selector cards — they were easy-to-miss tab pills) */
.pp-deck{margin:2px 0 16px}
.pp-note{margin:0 0 10px;color:var(--pp-muted);font-size:.88rem;line-height:1.6}
.pp-note b{color:var(--pp-text)}
.pp-deck-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:660px){.pp-deck-grid{grid-template-columns:1fr}}
.pp-scard{appearance:none;font:inherit;text-align:left;cursor:pointer;position:relative;
  display:flex;flex-direction:column;gap:5px;padding:13px 15px;min-width:0;
  background:var(--pp-surface);color:var(--pp-text);border:2px solid var(--pp-border);
  border-radius:12px;transition:border-color .12s ease,background .12s ease,transform .12s ease}
.pp-scard:hover{transform:translateY(-2px);border-color:var(--pp-accent)}
.pp-scard:focus-visible{outline:2px solid var(--pp-accent);outline-offset:2px}
.pp-scard[aria-selected="true"]{border-color:var(--pp-accent);
  background:color-mix(in srgb,var(--pp-accent) 8%,var(--pp-surface));
  box-shadow:0 0 0 3px color-mix(in srgb,var(--pp-accent) 20%,transparent)}
.pp-scard-tag{align-self:flex-start;border:1px solid;border-radius:999px;
  padding:2px 9px;font-size:.64rem;font-weight:800;letter-spacing:.07em}
.pp-scard-tag.real{color:var(--pp-good);border-color:var(--pp-good);
  background:color-mix(in srgb,var(--pp-good) 9%,transparent)}
.pp-scard-tag.demo{color:var(--pp-warn);border-color:var(--pp-warn);
  background:color-mix(in srgb,var(--pp-warn) 9%,transparent)}
.pp-scard .now{position:absolute;top:12px;right:14px;display:none;
  font-size:.64rem;font-weight:800;letter-spacing:.08em;color:var(--pp-accent)}
.pp-scard[aria-selected="true"] .now{display:inline}
.pp-scard-name{font-weight:800;font-size:1.02rem;line-height:1.3;padding-right:70px}
.pp-scard-sub{color:var(--pp-muted);font-size:.78rem;line-height:1.5}
.pp-scard-why{color:var(--pp-muted);font-size:.76rem;line-height:1.55}
.pp-scard-why b{color:var(--pp-text)}
.pp-head{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;
  justify-content:space-between;margin-bottom:10px}
.pp-title{margin:0;font-size:1.02rem;font-weight:700;line-height:1.35;overflow-wrap:anywhere}
.pp-sub{margin:0;color:var(--pp-muted);font-size:.82rem}
.pp-chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pp-chip{border:1px solid var(--pp-border);border-radius:999px;padding:2px 10px;
  font-size:.7rem;letter-spacing:.03em;color:var(--pp-muted)}
.pp-chip.real{border-color:var(--pp-good);color:var(--pp-good)}
.pp-chip.demo{border-color:var(--pp-warn);color:var(--pp-warn)}

/* verdict bar — the answer before the chart */
.pp-verdict{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;
  border:1px solid var(--pp-border);border-radius:10px;padding:10px 14px;
  margin-bottom:12px;background:color-mix(in srgb,var(--pp-surface) 92%,var(--pp-good) 8%)}
.pp-vpill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--pp-good);
  color:var(--pp-good);background:color-mix(in srgb,var(--pp-good) 10%,transparent);
  border-radius:999px;padding:6px 16px;font:800 1.02rem/1 var(--font-body);
  letter-spacing:.02em;white-space:nowrap}
.pp-vstats{color:var(--pp-muted);font-size:.8rem;line-height:1.6}
.pp-vstats b{color:var(--pp-text);font-variant-numeric:tabular-nums}

/* the spectrum — SVG, no external library. Two renderings of the same data:
   full hero on wide cards, compact minimap under 660px (playground strategy E);
   the zone cards below carry the interaction on both. */
.pp-plot{width:100%}
.pp-plot svg{display:block;width:100%;height:auto}
.pp-minimap{display:none}
@media (max-width:660px){
  .pp-plot-full{display:none}
  .pp-minimap{display:block;margin:2px 0 4px}
}
.pp-dot{cursor:default}
@media (hover:hover){.pp-dot:hover{filter:brightness(1.25)}}
.pp-b{opacity:0;transition:opacity .35s ease}
.pp-b.on{opacity:1}

/* zone cards (strategy E) */
.pp-zones{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
@media (max-width:660px){.pp-zones{grid-template-columns:1fr}}
.pp-zone{border:1px solid var(--pp-border);border-radius:10px;padding:10px 12px;
  min-width:0;opacity:0;transform:translateY(6px);transition:opacity .35s ease,transform .35s ease}
.pp-zone.on{opacity:1;transform:none}
.pp-zone h4{margin:0 0 4px;font-size:.78rem;letter-spacing:.04em;display:flex;
  justify-content:space-between;gap:8px;align-items:baseline}
.pp-zone .n{font-variant-numeric:tabular-nums;white-space:nowrap}
.pp-zone p{margin:0;font-size:.76rem;color:var(--pp-muted);line-height:1.5}
.pp-zone details{margin-top:6px}
.pp-zone summary{cursor:pointer;font-size:.74rem;color:var(--pp-accent);list-style:none;
  min-height:24px;display:flex;align-items:center}
.pp-zone summary::before{content:"▸ ";color:var(--pp-muted)}
.pp-zone details[open] summary::before{content:"▾ "}
.pp-zone .zrow{display:flex;gap:8px;align-items:baseline;font-size:.74rem;
  padding:4px 0;border-top:1px dashed var(--pp-border)}
.pp-zone .zrow .zp{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.pp-zone .zrow .zt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pp-zbait{border-left:3px solid var(--pp-bad)}
.pp-zbait h4{color:var(--pp-bad)}
.pp-zstreet{border-left:3px solid var(--pp-good)}
.pp-zstreet h4{color:var(--pp-good)}
.pp-zover{border-left:3px solid var(--pp-accent)}
.pp-zover h4{color:var(--pp-accent)}

/* funnel / filtered-out card */
.pp-funnel{margin-top:12px;border:1px solid color-mix(in srgb,var(--pp-warn) 45%,var(--pp-border));
  background:color-mix(in srgb,var(--pp-warn) 5%,var(--pp-surface));
  border-radius:10px;padding:10px 14px}
.pp-funnel h4{margin:0 0 6px;font-size:.8rem;color:var(--pp-warn)}
.pp-funnel .fl{display:flex;gap:8px;align-items:baseline;font-size:.76rem;
  color:var(--pp-muted);padding:2px 0}
.pp-funnel .fl b{color:var(--pp-text);font-variant-numeric:tabular-nums;min-width:34px;text-align:right}
.pp-funnel .fl .cut{color:var(--pp-warn)}
.pp-funnel .fsum{margin-top:6px;padding-top:6px;border-top:1px dashed var(--pp-border);
  font-size:.78rem;color:var(--pp-text)}
.pp-funnel details{margin-top:6px}
.pp-funnel summary{cursor:pointer;font-size:.74rem;color:var(--pp-accent);list-style:none;min-height:24px;display:flex;align-items:center}
.pp-funnel summary::before{content:"▸ ";color:var(--pp-muted)}
.pp-funnel details[open] summary::before{content:"▾ "}
.pp-funnel .frow{display:flex;gap:8px;align-items:baseline;font-size:.73rem;color:var(--pp-muted);padding:3px 0;border-top:1px dashed var(--pp-border)}
.pp-funnel .frow .fr{min-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* listing strip */
.pp-strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));
  gap:10px;margin-top:12px}
.pp-card{border:1px solid var(--pp-border);border-radius:10px;padding:10px 12px;
  min-width:0;opacity:0;transform:translateY(6px);transition:opacity .35s ease,transform .35s ease}
.pp-card.on{opacity:1;transform:none}
.pp-card .prow{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.pp-card .pp-p{font:700 1.0rem/1 var(--font-body);font-variant-numeric:tabular-nums}
.pp-chipv{display:inline-block;border-radius:999px;padding:2px 9px;font-size:.64rem;
  font-weight:800;letter-spacing:.05em;border:1px solid}
.pp-chipv.BUY{color:var(--pp-good);border-color:var(--pp-good);background:color-mix(in srgb,var(--pp-good) 9%,transparent)}
.pp-chipv.WAIT{color:var(--pp-warn);border-color:var(--pp-warn);background:color-mix(in srgb,var(--pp-warn) 9%,transparent)}
.pp-chipv.AVOID{color:var(--pp-bad);border-color:var(--pp-bad);background:color-mix(in srgb,var(--pp-bad) 9%,transparent)}
.pp-chipv.OVER{color:var(--pp-accent);border-color:var(--pp-accent);background:color-mix(in srgb,var(--pp-accent) 9%,transparent)}
.pp-card .pt{margin:6px 0 4px;font-size:.78rem;line-height:1.4;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pp-card .pm{font-size:.7rem;color:var(--pp-muted);line-height:1.6;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* dress-scenario product photo (marketplace-card look). Uniform 3:4 crop
   regardless of source aspect; the soft tint shows while it loads. */
.pp-card .pimg{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;
  border-radius:8px;border:1px solid var(--pp-border);margin:0 0 8px;
  background:color-mix(in srgb,var(--pp-accent) 6%,var(--pp-surface))}

/* controls + table */
.pp-controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.pp-btn{appearance:none;font:inherit;font-size:.8rem;color:var(--pp-text);
  background:color-mix(in srgb,var(--pp-accent) 8%,transparent);border:1px solid var(--pp-border);
  border-radius:999px;padding:6px 14px;cursor:pointer;min-height:34px}
.pp-btn:hover{border-color:var(--pp-accent)}
.pp-count{margin-left:auto;color:var(--pp-muted);font-size:.8rem;font-variant-numeric:tabular-nums}
.pp-table{margin-top:14px}
.pp-table summary{cursor:pointer;font-size:.86rem;color:var(--pp-muted)}
.pp-table table{width:100%;border-collapse:collapse;margin-top:8px;font-size:.74rem}
.pp-table th{text-align:left;color:var(--pp-muted);font-weight:600;
  border-bottom:1px solid var(--pp-border);padding:4px 8px;white-space:nowrap}
.pp-table td{border-bottom:1px solid var(--pp-border);padding:4px 8px;vertical-align:top}
.pp-table td.mono{font-family:var(--font-mono);white-space:nowrap}
.pp-caption{margin:10px 0 0;color:var(--pp-muted);font-size:.78rem;line-height:1.5}
.pp-caption .src{display:block;margin-top:4px}
@media (prefers-reduced-motion: reduce){
  .pp-b,.pp-zone,.pp-card,.pp-scard{transition:none}
}
</style>

    <div class="pp-deck-grid" role="tablist" aria-label="Scenario"></div>
  </div>
  <div class="pp-head">
    <div><h2 class="pp-title"></h2><p class="pp-sub"></p></div>
    <div class="pp-chips"></div>
  </div>
  <div class="pp-verdict">
    <span class="pp-vpill"></span>
    <span class="pp-vstats"></span>
  </div>
  <div class="pp-plot"></div>
  <div class="pp-zones"></div>
  <div class="pp-funnel"></div>
  <div class="pp-strip"></div>
  <div class="pp-controls">
    <button class="pp-btn pp-replay" type="button">▶ Replay unfold</button>
    <span class="pp-count"></span>
  </div>
  <details class="pp-table"><summary></summary>
    <div style="overflow-x:auto"><table>
      <thead><tr><th>price</th><th>verdict</th><th>condition</th><th>seller</th>
        <th>fb</th><th>%</th><th>top-rated</th><th>ship</th><th>ships from</th><th>title</th></tr></thead>
      <tbody></tbody>
    </table></div>
  </details>
  <p class="pp-caption"></p>`;

const $ = s => root.querySelector(s);
const deckEl = $(".pp-deck-grid"), titleEl = $(".pp-title"), subEl = $(".pp-sub"),
      chipsEl = $(".pp-chips"), pillEl = $(".pp-vpill"), statsEl = $(".pp-vstats"),
      plotEl = $(".pp-plot"), zonesEl = $(".pp-zones"), funnelEl = $(".pp-funnel"),
      stripEl = $(".pp-strip"), countEl = $(".pp-count"), tbody = root.querySelector(".pp-table tbody"),
      tableSum = root.querySelector(".pp-table summary"), capEl = $(".pp-caption");

let cur = Math.max(0, SCENARIOS.findIndex(s => s.id ===
  new URLSearchParams(location.search).get("s")));
const S = () => SCENARIOS[cur];
const D = () => S().data;
const M = () => D().meta;

/* UDL bridge — read live tokens at render time (map.html pattern) */
const cssVar = n => getComputedStyle(root).getPropertyValue(n).trim();

/* ---- the spectrum SVG ---------------------------------------------------- */
function buildSVG(mini) {
  const d = D(), m = M();
  const W = 640, x0 = 10, x1 = 630;
  const top = mini ? 12 : 40, base = mini ? 58 : 180;
  const X = p => x0 + (p / m.xmax) * (x1 - x0);
  const zones = [[0, m.lf, "--bad", .10], [m.lf, m.p25, "--warn", .05],
                 [m.p25, m.p75, "--good", .13], [m.p75, m.uf, "--warn", .05],
                 [m.uf, m.xmax, "--accent", .07]];
  let g = "";
  /* zones */
  for (const [a, b, tok, op] of zones) {
    const c = cssVar(tok);
    g += `<rect class="pp-b" data-b="0" x="${X(a).toFixed(1)}" y="${top}" width="${(X(b)-X(a)).toFixed(1)}" height="${base-top}" fill="${c}" fill-opacity="${op}"/>`;
  }
  /* axis + ticks */
  g += `<line class="pp-b" data-b="0" x1="${x0}" y1="${base}" x2="${x1}" y2="${base}" stroke="${cssVar("--muted")}" stroke-width="1" stroke-opacity=".55"/>`;
  const ticks = mini ? [0, m.xmax] : [0, .25, .5, .75, 1].map(f => f * m.xmax);
  for (const t of ticks) {
    const lbl = t >= 1000 ? "$" + (t/1000).toFixed(1).replace(/\.0$/, "") + "k" : "$" + Math.round(t);
    g += `<text class="pp-b" data-b="0" x="${X(t)}" y="${base + (mini?12:15)}" text-anchor="middle" font-size="${mini?9:10}" fill="${cssVar("--muted")}">${lbl}</text>`;
  }
  /* sold density silhouette from the histogram */
  const hist = d.hist, NB = hist.length, peak = Math.max(...hist);
  const hMax = (base - top) * (mini ? .72 : .55);
  let path = `M ${x0} ${base}`;
  hist.forEach((h, i) => {
    const xa = x0 + (i / NB) * (x1 - x0), xb = x0 + ((i + 1) / NB) * (x1 - x0);
    const y = base - (h / peak) * hMax;
    path += ` L ${xa.toFixed(1)} ${y.toFixed(1)} L ${xb.toFixed(1)} ${y.toFixed(1)}`;
  });
  path += ` L ${x1} ${base} Z`;
  const dens = cssVar("--accent");
  g += `<defs><linearGradient id="ppdg${mini?"m":"f"}" x1="0" y1="0" x2="0" y2="1">`
     + `<stop offset="0" stop-color="${dens}" stop-opacity=".42"/><stop offset="1" stop-color="${dens}" stop-opacity=".05"/></linearGradient></defs>`;
  g += `<path class="pp-b" data-b="1" d="${path}" fill="url(#ppdg${mini?"m":"f"})"/>`;
  /* fences + median */
  for (const [v, lab] of [[m.lf, "fence " + fmt(m.lf)], [m.uf, "fence " + fmt(m.uf)]]) {
    g += `<line class="pp-b" data-b="2" x1="${X(v)}" y1="${top}" x2="${X(v)}" y2="${base}" stroke="${cssVar("--muted")}" stroke-dasharray="4 4" stroke-opacity=".7"/>`;
    if (!mini) g += `<text class="pp-b" data-b="2" x="${X(v)}" y="${top - 5}" text-anchor="middle" font-size="8.5" fill="${cssVar("--muted")}">${lab}</text>`;
  }
  g += `<line class="pp-b" data-b="2" x1="${X(m.p50)}" y1="${top}" x2="${X(m.p50)}" y2="${base}" stroke="${cssVar("--accent")}" stroke-dasharray="2 4"/>`;
  if (!mini) g += `<text class="pp-b" data-b="2" x="${X(m.p50) - 4}" y="${base - 6}" text-anchor="end" font-size="9" fill="${cssVar("--accent")}" font-weight="600">sold median ${fmt(m.p50)}</text>`;
  /* MSRP pin (gpu only) */
  if (S().msrp != null && !mini) {
    const mx = X(S().msrp);
    g += `<g class="pp-b" data-b="5"><line x1="${mx}" y1="${top - 12}" x2="${mx}" y2="${base}" stroke="${cssVar("--muted")}"/>`
       + `<path d="M ${mx-4} ${top-12} l 4 -8 l 4 8 z" fill="${cssVar("--muted")}"/>`
       + `<text x="${mx + 5}" y="${top - 16}" font-size="9" fill="${cssVar("--muted")}" font-weight="600">MSRP ${fmt(S().msrp)}</text></g>`;
  }
  /* live ask dots — altitude suggests the verdict row (never color alone:
     every dot's verdict also exists as chip text below + table row) */
  const DOT = {AVOID:"--bad", DEAL:"--good", BUY:"--good", WAIT:"--warn", OVER:"--accent"};
  const ROW = {AVOID:0, DEAL:1, BUY:1, WAIT:2, OVER:3};
  const r = mini ? 4 : 6;
  const yFor = (v, i) => {
    const row = ROW[v] ?? 1;
    if (mini) return top + 8 + [0.76, 0.48, 0.28, 0.1][row] * (base - top - 12) + ((i * 37) % 6);
    const [y0, y1] = [[base-30,base-14],[base-66,base-46],[base-96,base-78],[base-126,base-108]][row];
    return y0 + ((i * 37) % (y1 - y0));
  };
  let i = 0;
  for (const a of d.asks) {
    const y = yFor(a.v, i++);
    const c = cssVar(DOT[a.v]);
    const beat = a.v === "AVOID" ? 3 : (a.v === "OVER" ? 5 : 4);
    const tt = esc(fmt(a.price) + " live ask · " + chipOf(a.v));
    if (a.best) {
      g += `<g class="pp-b" data-b="5"><circle cx="${X(a.price)}" cy="${y}" r="${r + 7}" fill="none" stroke="${c}" stroke-opacity=".55" stroke-width="1.5"><title>${tt} ★ best deal</title></circle>`
         + `<circle cx="${X(a.price)}" cy="${y}" r="${r + 2}" fill="${c}" stroke="${cssVar("--card")}" stroke-width="1.5"></circle>`
         + `<text x="${X(a.price)}" y="${y + 3.5}" text-anchor="middle" font-size="${mini?8:10}" fill="${cssVar("--card")}" font-weight="700">★</text></g>`;
    } else {
      g += `<circle class="pp-b" data-b="${beat}" cx="${X(a.price)}" cy="${y}" r="${r}" fill="${c}" stroke="${cssVar("--card")}" stroke-width="1"><title>${tt}</title></circle>`;
    }
  }
  /* zone labels (full only) */
  if (!mini) {
    g += `<text class="pp-b" data-b="0" x="${X(m.lf * .55)}" y="${top + 11}" text-anchor="middle" font-size="9.5" font-weight="700" fill="${cssVar("--bad")}" letter-spacing=".5">⚠ BAIT ZONE</text>`
       + `<text class="pp-b" data-b="0" x="${X((m.p25 + m.p75) / 2)}" y="${top + 11}" text-anchor="middle" font-size="9.5" font-weight="700" fill="${cssVar("--good")}" letter-spacing=".5">■ STREET BAND</text>`
       + `<text class="pp-b" data-b="0" x="${x1 - 4}" y="${top + 11}" text-anchor="end" font-size="9.5" font-weight="700" fill="${cssVar("--accent")}" letter-spacing=".5">□ OVER-ASK</text>`
       + `<text class="pp-b" data-b="1" x="${x1}" y="${base - 10}" text-anchor="end" font-size="9" fill="${cssVar("--muted")}" font-style="italic">silhouette: ${Number(d.zones.sold.street + d.zones.sold.gap_lo + d.zones.sold.scam + d.zones.sold.gap_hi + d.zones.sold.over).toLocaleString("en-US")} sold prices</text>`;
  }
  /* trimmed from 250: chart content ends at y≈197 (axis + tick labels) — the
     old viewBox left a ~50-unit dead band that read as empty page space */
  const h = mini ? 76 : 206;
  return `<svg viewBox="0 0 ${W} ${h}" role="img" aria-label="Price spectrum: live asks plotted over the sold-price density">${g}</svg>`;
}

/* ---- zone cards ---------------------------------------------------------- */
function zoneRows(list) {
  return list.map(r => `<div class="zrow"><span class="zp">${fmt(r.price)}</span>`
    + `<span class="zt" title="${esc(r.title)}">${esc(r.title.slice(0, 46))}${r.title.length > 46 ? "…" : ""}</span>`
    + `<span class="pp-chipv ${chipOf(r._v)}">${chipOf(r._v)}${r._v === "DEAL" ? " ★" : ""}</span></div>`).join("");
}
function buildZones() {
  const d = D();
  const byZone = {
    zbait:  d.table.filter(r => r.price < M().lf),
    zstreet: d.table.filter(r => r.price >= M().p25 && r.price <= M().p75),
    zover:  d.table.filter(r => r.price > M().uf),
  };
  zonesEl.innerHTML = S().zones.map(z => `
    <div class="pp-zone ${z.cls}">
      <h4>${z.head}<span class="n">${z.n}</span></h4>
      <p>${z.sub}</p>
      ${byZone[z.cls] && byZone[z.cls].length ? `<details><summary>top listings in this zone</summary>
        ${zoneRows(byZone[z.cls].slice(0, 5))}</details>` : ""}
    </div>`).join("");
}

/* ---- funnel card (gpu only — walkthrough 2026-09-21 dropped the dress
   scenario's slop-funnel section; its deck card carries the explanation) --- */
function buildFunnel() {
  const d = D();
  if (S().id !== "gpu") {
    funnelEl.innerHTML = "";
    funnelEl.style.display = "none";
    return;
  }
  funnelEl.style.display = "";
  const rl = d.reasons_live;
  const LINES = [
    ["not the actual card", rl.product_mismatch],
    ["accessory-only listing", rl.accessory_only],
    ["3090 Ti dressed as a 3090", rl.ti_variant],
    ["ambiguous multi-variant listing", rl.ambiguous_multivariant],
    ["bundle / multi-item lot", rl.bundle_multi],
  ];
  funnelEl.innerHTML = `<h4>${S().funnelTitle}</h4>`
    + LINES.filter(l => l[1]).map(l =>
      `<div class="fl"><b>${l[1]}</b><span class="cut">✂</span><span>${l[0]}</span></div>`).join("")
    + `<div class="fl"><b>+${(rl.ambiguous_accessory||0)+(rl.ambiguous_bundle||0)+(rl.ambiguous_formfactor||0)+(rl.engineering_board||0)}</b><span class="cut">✂</span><span>ambiguous listings + a $30,000 “engineering sample”</span></div>`
    + `<div class="fsum">377 live + 865 sold excluded — every one a listing you didn’t have to open.</div>`
    + `<details><summary>evidence — real excluded listings</summary>${evidenceRows(d)}</details>`;
}
function evidenceRows(d) {
  return Object.entries(d.evidence).slice(0, 6).map(([k, e]) =>
    `<div class="frow"><span class="fr">${esc(k)}</span><span>${esc(e.title.slice(0, 58))}${e.title.length > 58 ? "…" : ""}</span><span style="white-space:nowrap">${fmt(e.price)}</span></div>`).join("");
}

/* ---- listing strip + table ---------------------------------------------- */
function cardMeta(r) {
  const bits = [];
  if (r.cond) bits.push(esc(r.cond));
  if (r.scount != null) bits.push(`${Number(r.scount).toLocaleString("en-US")} fb${r.spct != null ? " · " + Number(r.spct).toFixed(1) + "%" : ""}`);
  if (r.trp) bits.push("✓ top-rated");
  if (r.ship != null) bits.push(r.ship === 0 ? "ships free" : "+" + fmt(r.ship) + " ship");
  if (r.loc) bits.push(esc(r.loc));
  return bits.join(" · ");
}
function buildStrip() {
  const imgs = S().imgPool ? fisherYates(S().imgPool.slice()) : null;
  stripEl.innerHTML = D().cards.map((r, i) => `
    <div class="pp-card">
      ${imgs ? `<img class="pimg" src="${imgs[i % imgs.length]}"
        alt="illustrative product photo" loading="lazy">` : ""}
      <div class="prow"><span class="pp-p">${r._v === "DEAL" ? "★ " : ""}${fmt(r.price)}</span>
        <span class="pp-chipv ${chipOf(r._v)}">${chipOf(r._v)}${r._v === "DEAL" ? " ★ best deal" : ""}</span></div>
      <div class="pt" title="${esc(r.title)}">${esc(r.title)}</div>
      <div class="pm">${cardMeta(r)}</div>
    </div>`).join("");
}
function buildTable() {
  tbody.innerHTML = D().table.map(r => `
    <tr><td class="mono">${fmt(r.price)}</td>
    <td><span class="pp-chipv ${chipOf(r._v)}">${chipOf(r._v)}</span></td>
    <td>${esc(r.cond || "—")}</td><td>${esc(r.seller || "—")}</td>
    <td class="mono">${r.scount != null ? Number(r.scount).toLocaleString("en-US") : "—"}</td>
    <td class="mono">${r.spct != null ? Number(r.spct).toFixed(1) : "—"}</td>
    <td>${r.trp ? "✓" : "—"}</td>
    <td class="mono">${r.ship != null ? (r.ship === 0 ? "free" : fmt(r.ship)) : "—"}</td>
    <td>${esc(r.loc || "—")}</td><td>${esc(r.title)}</td></tr>`).join("");
  tableSum.textContent = `Data of record — ${D().table.length}-row ${S().id === "gpu" ? "live-listing sample (of 509)" : "sample"} · the spectrum is its projection`;
}

/* ---- scenario fill + unfold --------------------------------------------- */
function fillScenario() {
  const sc = S();
  titleEl.textContent = sc.title;
  subEl.textContent = sc.sub;
  chipsEl.innerHTML = `<span class="pp-chip ${sc.chipClass}">${sc.chips[0]}</span>`
    + sc.chips.slice(1).map(c => `<span class="pp-chip">${esc(c)}</span>`).join("");
  pillEl.textContent = sc.verdictPill;
  statsEl.innerHTML = sc.verdictStats;
  plotEl.innerHTML = `<div class="pp-minimap">${buildSVG(true)}</div>`
    + `<div class="pp-plot-full">${buildSVG(false)}</div>`;
  buildZones(); buildFunnel(); buildStrip(); buildTable();
  capEl.innerHTML = esc(sc.caption).replace(/&lt;i&gt;|&lt;\/i&gt;/g, "");
}

let timer = null, beat = 0, BEATS = 8;
function reveal(n) {
  /* SVG groups by data-b, then zone cards and listing cards stagger after beat 6 */
  root.querySelectorAll(`.pp-b[data-b]`).forEach(el =>
    el.classList.toggle("on", n >= Number(el.dataset.b)));
  [...zonesEl.children].forEach((el, i) => el.classList.toggle("on", n >= 6 + i));
  [...stripEl.children].forEach((el, i) => el.classList.toggle("on", n >= 6 + Math.min(i, 2)));
}
function step() {
  beat++;
  reveal(beat);
  countEl.textContent = beatLabel();
  if (beat >= BEATS) { timer = null; return; }
  timer = setTimeout(step, reduced ? 0 : 420);
}
function beatLabel() {
  const d = D();
  return `${d.asks.length} of ${S().id === "gpu" ? 509 : 38} asks sampled on the axis · `
    + `${Number(d.zones.sold.street + d.zones.sold.gap_lo + d.zones.sold.scam + d.zones.sold.gap_hi + d.zones.sold.over).toLocaleString("en-US")} sold in silhouette`;
}
function play() {
  if (timer) { clearTimeout(timer); timer = null; }
  beat = 0; reveal(0); countEl.textContent = "";
  if (reduced) { beat = BEATS; reveal(beat); countEl.textContent = beatLabel(); return; }
  timer = setTimeout(step, 350);
}

/* ---- scenario deck + deep links (was tab pills; map.html deep-link pattern) */
function buildDeck() {
  deckEl.innerHTML = "";
  SCENARIOS.forEach((sc, i) => {
    const b = document.createElement("button");
    b.className = "pp-scard"; b.type = "button";
    b.setAttribute("role", "tab");
    b.setAttribute("aria-selected", String(i === cur));
    b.innerHTML = `<span class="pp-scard-tag ${sc.deckTagCls}">${sc.deckTag}</span>`
      + `<span class="now" aria-hidden="true">● viewing</span>`
      + `<span class="pp-scard-name">${sc.deckName}</span>`
      + `<span class="pp-scard-sub">${sc.deckSub}</span>`
      + `<span class="pp-scard-why">${sc.why}</span>`;
    b.addEventListener("click", () => setScenario(i));
    deckEl.appendChild(b);
  });
}
function setScenario(i) {
  cur = i;
  [...deckEl.children].forEach((b, j) => b.setAttribute("aria-selected", String(j === cur)));
  const u = new URL(location);
  u.searchParams.set("s", S().id);
  history.replaceState(null, "", u);
  fillScenario(); play();
}

$(".pp-replay").addEventListener("click", play);
buildDeck(); fillScenario(); play();
})();
</script>
</body>
</html>
